[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meds_sort"
version = "0.4.0"
description = "Sort and shard a MEDS Unsorted dataset into MEDS, implemented in pure Python/Polars (formerly meds_etl_cpp)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "polars>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
benchmark = [
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
where = ["."]
# meds_sort is the package; meds_etl_cpp is a deprecated compatibility shim.
include = ["meds_sort", "meds_etl_cpp"]
exclude = []
namespaces = false
