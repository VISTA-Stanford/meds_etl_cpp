[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meds_etl_cpp"
version = "0.4.0"
description = "Optimized MEDS Unsorted -> MEDS ETL, now implemented in pure Python/Polars (the former C++ backend has been deprecated)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "polars>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
benchmark = [
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meds_etl_cpp"]
exclude = []
namespaces = false
