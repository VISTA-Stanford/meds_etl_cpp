[build-system]
requires = ["setuptools", "setuptools-scm", "pyarrow", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "meds_etl_cpp"
dynamic = ["version"]
description = "Optimized algorithms for meds_etl implemented in C++."
readme = "README.md"
requires-python=">3.9"
license = "Apache-2.0"
dependencies = [
    "pyarrow>=18.0.0",  # Required at runtime for Arrow libraries
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["meds_etl_cpp"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.cibuildwheel]
skip = ["*-musllinux_* pp*"]
archs = ["auto64"]
# Build separate wheels for Python 3.10, 3.11, 3.12
build = ["cp310-*", "cp311-*", "cp312-*"]

[tool.cibuildwheel.linux]
before-all = "bash build/linux_setup.sh"
before-build = "git restore native/MODULE.bazel.lock"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET="12" }
before-all = "bash setup_dependencies.sh"
# Uses Makefile build (auto-detects Python version)
